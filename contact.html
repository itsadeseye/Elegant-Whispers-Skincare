<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Dark Spots Removal</h1>
    <nav class="navbar navbar-expand-lg bg-light shadow-sm px-4 py-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-dark" href="index.html"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav gap-3">
        <li class="nav-item">
          <a class="nav-link text-dark" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="features.html">Features</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="sign-up.html">Sign Up</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="contact.html">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  </header>

  <section class="contact-section">
    <h2>Contact Our Team</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" required />

      <label for="subject">Subject:</label>
      <input type="text" id="subject" required />

      <label for="message">Message:</label>
      <textarea id="message" required></textarea>

      <button type="submit">Send Message</button>
      <div class="message" id="confirmationMessage"></div>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Elegant Whispers Skincare</p>
  </footer>

  <script src="script.js"></script>
