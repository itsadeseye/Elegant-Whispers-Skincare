<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Dark Spots Removal</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-dark" href="index.html">Dark Spots Removal</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-dark" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-dark" href="features.html">Features</a></li>
          <li class="nav-item"><a class="nav-link text-dark "href=" sign-up.html">Sign Up</a></li>
          <li class="nav-item"><a class="nav-link text-dark "href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <div class="progress-steps">
      <div class="step active">Step 1<br><small>Fill Form</small></div>
      <div class="step">Step 2<br><small>Assessment</small></div>
      <div class="step">Step 3<br><small>Results</small></div>
    </div>

    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="concern">What skin concern are you facing?</label>
      <textarea id="concern" name="concern" rows="4" placeholder="Describe your skin condition..." required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Elegant Whispers Skincare</p>
    <a class="cta-link" href="contact.html">Contact Us</a>
  </footer>

  <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
